[project]
name = "smart-hub"
version = "0.1.0"
description = "Python library and CLI for the UM Smart USB Hub"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Matt Trentini", email = "matthew.trentini@planetinnovation.com.au" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.16.0",
    "rich>=15.0.0",
    "typer>=0.29.0",
]

[project.scripts]
hub = "smart_hub.cli:app"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
