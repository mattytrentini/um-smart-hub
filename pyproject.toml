[project]
name = "um-smart-hub"
version = "0.1.0"
description = "Python library and CLI for the UM Smart USB Hub"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Matt Trentini", email = "matthew.trentini@planetinnovation.com.au" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx2>=2.16.0",
    "rich>=15.0.0",
    "typer>=0.29.0",
]

[project.scripts]
hub = "smart_hub.cli:app"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "smart_hub"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.100",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.ty.environment]
python-version = "3.14"
